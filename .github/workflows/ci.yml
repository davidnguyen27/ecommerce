# CI for every push and PR: web lint and tests, typecheck, API tests (Testcontainers), full-stack smoke (docker compose)
# and Playwright E2E on that stack.
# Ubuntu runners have Docker, so no secrets are needed: tests use test values, smoke generates JWT_SECRET, email goes
# to the log, files stay in memory, payments use the simulator.
# No retries: Linux CI is the judge of flaky tests on Docker Desktop (M0–M1 ticket 15).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Pure-logic web tests (no Docker), run here to keep it simple.
      - run: pnpm --filter @ecommerce/web test

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # global-setup starts Postgres with Testcontainers, via the runner's Docker.
      - run: pnpm --filter @ecommerce/api test

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # No dependency install and no cache: scripts/smoke.ts uses only Node built-ins, and the api and web images are built
      # by docker compose.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm smoke

  # Real-browser purchase flow (M3 ticket 14) on the smoke stack. Runs after smoke passes and rebuilds the stack with
  # `pnpm smoke --keep` (separate job, separate machine). On red, download the Playwright trace from the artifacts.
  e2e:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ecommerce/e2e exec playwright install --with-deps chromium
      - run: pnpm smoke --keep
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
