# Local environment: docker compose up --build, then open http://localhost
# To view images and documents: set the local S3 vars from .env.example in .env (COMPOSE_PROFILES=local).
x-database-url: &database-url postgresql://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-ecommerce}@postgres:5432/${POSTGRES_DB:-ecommerce}

services:
  postgres:
    # The official image ships contrib (unaccent, pg_trgm); the first migration enables them.
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 30

  # Migrations run as a separate step before the API starts.
  migrate:
    build: { context: ., dockerfile: api/Dockerfile }
    command: ['pnpm', 'migrate']
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: api/Dockerfile }
    environment:
      DATABASE_URL: *database-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Defaults are for local only; staging/production must set their own keys.
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-khong-dung-cho-production}
      # Base URL for links sent by email.
      SITE_URL: ${SITE_URL:-http://localhost:${HTTP_PORT:-80}}
      # Local only logs emails; staging/production set MAIL_PROVIDER=resend with RESEND_API_KEY, MAIL_FROM.
      MAIL_PROVIDER: ${MAIL_PROVIDER:-log}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Local keeps files in memory; staging/production set STORAGE_PROVIDER=r2 with the R2_* vars and MEDIA_PUBLIC_URL.
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-memory}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_BUCKET: ${R2_PUBLIC_BUCKET:-}
      R2_PRIVATE_BUCKET: ${R2_PRIVATE_BUCKET:-}
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-}
      # Both VNPAY keys set means VNPAY (VNPAY_ENV defaults to sandbox). The image runs NODE_ENV=production, so missing or
      # sandbox keys stop the API unless PAYMENT_SIMULATOR=allow is set (local and smoke only; never in production).
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_ENV: ${VNPAY_ENV:-}
      VNPAY_SERVER_IP: ${VNPAY_SERVER_IP:-}
      PAYMENT_SIMULATOR: ${PAYMENT_SIMULATOR:-}
      # Chatbot (ADR 0017): free-tier keys; empty turns the chatbot off. Empty LLM_CHAIN is the default chain.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_CHAIN: ${LLM_CHAIN:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
      # Only with the local profile; staging/production skip it.
      s3-buckets: { condition: service_completed_successfully, required: false }

  web:
    build: { context: ., dockerfile: web/Dockerfile }
    environment:
      NUXT_API_BASE: http://api:3001
      NUXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:${HTTP_PORT:-80}}
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
      - web

  # Local only (COMPOSE_PROFILES=local): SeaweedFS as S3-compatible storage instead of R2, to view images and documents.
  # Browser and API both call http://s3.localhost:9000: browsers resolve *.localhost to the machine itself, and inside
  # Docker the alias below points to this container, so signed URLs work on both sides.
  # Access: the R2_ACCESS_KEY_ID key writes every bucket; anonymous users only read the public bucket, like a CDN.
  s3:
    image: chrislusf/seaweedfs:4.48
    profiles: [local]
    entrypoint: ['sh', '-c']
    command:
      - >
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Write","Tagging"]},{"name":"anonymous","actions":["Read:%s"]}]}'
        "$$ACCESS_KEY" "$$SECRET_KEY" "$$PUBLIC_BUCKET" > /tmp/s3.json &&
        exec weed server -dir=/data -master.volumeSizeLimitMB=1024 -s3 -s3.port=9000 -s3.config=/tmp/s3.json
    environment:
      ACCESS_KEY: ${R2_ACCESS_KEY_ID:-local-access-key}
      SECRET_KEY: ${R2_SECRET_ACCESS_KEY:-local-secret-key}
      PUBLIC_BUCKET: ${R2_PUBLIC_BUCKET:-media-public}
    ports:
      - '9000:9000'
    volumes:
      - s3_data:/data
    networks:
      default:
        aliases: [s3.localhost]
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && nc -z 127.0.0.1 9000']
      interval: 2s
      timeout: 3s
      retries: 60

  # Create the public and private buckets. weed shell errors when a bucket exists, so ignore creation errors, then check
  # both buckets are listed.
  s3-buckets:
    image: chrislusf/seaweedfs:4.48
    profiles: [local]
    entrypoint: ['sh', '-c']
    command:
      - >
        { echo "s3.bucket.create -name $$PUBLIC_BUCKET"; echo "s3.bucket.create -name $$PRIVATE_BUCKET"; }
        | weed shell -master=s3:9333;
        echo s3.bucket.list | weed shell -master=s3:9333 > /tmp/buckets &&
        grep -qw "$$PUBLIC_BUCKET" /tmp/buckets && grep -qw "$$PRIVATE_BUCKET" /tmp/buckets
    environment:
      PUBLIC_BUCKET: ${R2_PUBLIC_BUCKET:-media-public}
      PRIVATE_BUCKET: ${R2_PRIVATE_BUCKET:-media-private}
    depends_on:
      s3: { condition: service_healthy }

volumes:
  pgdata:
  caddy_data:
  s3_data:
