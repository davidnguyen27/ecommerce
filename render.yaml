# Render Blueprint for the demo API (ADR 0011, docs/deploy.md). The web runs on Netlify (web/netlify.toml), the DB on
# Neon, images on Cloudflare R2. `sync: false` vars are filled in the Render dashboard when creating the Blueprint; no
# keys here.
services:
  - type: web
    name: atelier-demo-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: api/Dockerfile
    dockerContext: .
    # The Free plan has no pre-deploy command: run migrations, then start the API (the api `start:migrate` script; the
    # image WORKDIR is /repo/api). Render cannot split `sh -c "..."` (the whole string becomes the command), so one command.
    dockerCommand: pnpm start:migrate
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: JWT_SECRET
        generateValue: true
      # Neon: the direct connection string (no -pooler), since pg-boss uses LISTEN/NOTIFY.
      - key: DATABASE_URL
        sync: false
      # Web URL on Netlify, e.g. https://<site>.netlify.app: links in emails, the page VNPAY returns customers to.
      - key: SITE_URL
        sync: false
      # Via Netlify: "<client>, <Netlify internal 100.64.x>, <Netlify 47.130.x>, <Cloudflare>, <10.x>": 5 hops, measured
      # with the audit log (ADR 0011).
      - key: TRUST_PROXY
        value: '5'
      - key: MAIL_PROVIDER
        value: log
      - key: STORAGE_PROVIDER
        value: r2
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_BUCKET
        sync: false
      - key: R2_PRIVATE_BUCKET
        sync: false
      - key: MEDIA_PUBLIC_URL
        sync: false
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VNPAY_ENV
        value: sandbox
      # The image runs NODE_ENV=production; VNPAY sandbox keys in production need this line (demo, no real money).
      - key: PAYMENT_SIMULATOR
        value: allow
      # Chatbot (ADR 0017): free-tier keys; empty turns the chatbot off.
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
