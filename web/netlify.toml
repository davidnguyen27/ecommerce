# Demo web on Netlify (ADR 0011, docs/deploy.md). In the Netlify dashboard: Package directory = `web`, Base directory
# empty (repo root), so pnpm sees the whole workspace. Paths here are relative to the repo root.
# Env vars set in the dashboard: NUXT_API_BASE (API URL on Render, for SSR), NUXT_PUBLIC_SITE_URL (site URL).

[build]
  command = "pnpm --filter @ecommerce/web... build"
  publish = "web/dist"

[build.environment]
  # Node version from .nvmrc, pnpm from the root package.json `packageManager`. Nuxt on Netlify docs: pnpm needs hoisting.
  PNPM_FLAGS = "--shamefully-hoist"

# The browser calls /api/... same-origin as behind Caddy: the refresh cookie (host-only, SameSite=Strict) still works,
# no CORS needed. Netlify waits up to 26 s for the API. Change the host if Render assigns a URL different from the
# service name in render.yaml.
[[redirects]]
  from = "/api/*"
  to = "https://atelier-demo-api.onrender.com/api/:splat"
  status = 200
  force = true
